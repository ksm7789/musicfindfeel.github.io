name: 주간 곡 목록 갱신

on:
  schedule:
    # 매주 월요일 오전 6시 17분 (한국 시간) = 일요일 21:17 UTC
    - cron: "17 21 * * 0"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["*.mjs"]

permissions:
  contents: write

concurrency:
  group: update-songs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 곡 목록 수집·분류
        run: node update-songs.mjs

      - name: 변경 사항 저장
        run: |
          if git diff --quiet -- songs.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "songs-bot"
          git config user.email "songs-bot@users.noreply.github.com"
          git add songs.json
          git commit -m "곡 목록 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
